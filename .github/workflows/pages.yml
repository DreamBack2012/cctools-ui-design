name: Publish design previews

on:
  push:
    branches:
      - main
      - 'design-v*'
  delete:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Prepare all design branches
        run: node script/build-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy previews
        id: deployment
        uses: actions/deploy-pages@v4
